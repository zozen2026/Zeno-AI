<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#fff;--card:rgba(255,255,255,.9);--border:#e2e8f0;--text:#0f172a;--grad:linear-gradient(135deg,#2563eb,#7c3aed,#ec4899)}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;transition:background .3s ease}
    header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--card);backdrop-filter:blur(10px);gap:8px;flex-wrap:wrap}
    .brand{font-size:20px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    select,button,input{font-family:inherit;font-size:13px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:var(--text);padding:6px 10px;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .share-wrap{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);background:#fff}
    .share-note{font-size:11px;font-weight:700;color:#334155}
    .share-top-btn{padding:4px 7px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
    .live-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid #bbf7d0;background:#f0fdf4;color:#166534;font-size:12px;font-weight:700}
    .live-dot{width:8px;height:8px;border-radius:50%;background:#16a34a}
    .bg-dots{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--border);border-radius:999px;background:#fff}
    .dot{width:15px;height:15px;border-radius:50%;border:1.5px solid #cbd5e1;padding:0}
    .dot.active{border-color:#2563eb;transform:scale(1.15)}
    .user-box{display:inline-flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:2px 6px}
    .avatar{width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;overflow:hidden}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .uname{font-size:11px;font-weight:700;color:#334155;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;max-width:820px;width:100%;margin:0 auto}
    .msg{max-width:82%;padding:11px 14px;border-radius:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;box-shadow:0 3px 12px rgba(15,23,42,.04)}
    .msg.user{align-self:flex-start;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff}
    .msg.bot{align-self:flex-end;background:var(--card);border:1px solid #dbeafe}
    .actions{display:flex;gap:5px;margin-top:6px}
    .icon-btn{padding:4px 7px;border-radius:8px;background:rgba(255,255,255,.92);color:#0f172a;display:inline-flex;align-items:center}
    .msg.user .icon-btn{background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.35)}
    .ico{width:14px;height:14px;display:block}
    .mic-btn{padding:8px 10px;display:inline-flex;align-items:center;justify-content:center}
    .mic-btn.active{background:linear-gradient(135deg,#ef4444,#ec4899);color:#fff;border-color:#ef4444}
    footer{border-top:1px solid var(--border);padding:10px 14px;background:var(--card)}
    form{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center}
    textarea{flex:1;resize:none;border:1px solid #cbd5e1;border-radius:12px;padding:9px 12px;font-family:inherit;font-size:14px;min-height:42px;max-height:110px;background:#fff}
    .send{background:var(--grad);color:#fff;border:none;font-weight:700;padding:10px 16px}
    .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.38);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
    .backdrop.open{display:flex}
    .modal{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:350px;display:flex;flex-direction:column;gap:8px;box-shadow:0 18px 36px rgba(15,23,42,.18)}
    .tabs{display:flex;gap:6px}.tabs button{flex:1}.tabs .active{background:#2563eb;color:#fff;border-color:#2563eb}
  </style>
</head>
<body>
  <header>
    <div class="brand">My AI</div>
    <div class="controls">
      <div class="share-wrap">
        <span class="share-note">(شارك الرابط ادناه لاصدقائك ولعائلتك!)</span>
        <button type="button" id="shareLinkBtn" class="share-top-btn" title="نسخ الرابط https://myai-iota-amber.vercel.app/" aria-label="نسخ الرابط"></button>
      </div>
      <div class="live-badge" id="liveDevicesBadge" title="الأجهزة النشطة الآن">
        <span class="live-dot"></span>
        <span id="liveDevicesCount">1</span>
      </div>
      <select id="modelSelect">
        <option value="openai/gpt-oss-20b">GPT-OSS 20B</option>
        <option value="openai/gpt-oss-120b">GPT-OSS 120B</option>
        <option value="qwen/qwen3.8-27b">Qwen3.8 27B</option>
      </select>
      <select id="voiceSelect"><option value="">Microsoft Auto Voice</option></select>
      <button type="button" id="stopBtn" data-i18n="stopVoice">إيقاف الصوت</button>
      <div class="bg-dots">
        <button type="button" class="dot active" data-bg="#ffffff" style="background:#fff"></button>
        <button type="button" class="dot" data-bg="linear-gradient(135deg,#fff,#eff6ff)" style="background:#dbeafe"></button>
        <button type="button" class="dot" data-bg="linear-gradient(135deg,#fff,#f5f3ff)" style="background:#ede9fe"></button>
        <button type="button" class="dot" data-bg="linear-gradient(135deg,#fff,#ecfdf5)" style="background:#d1fae5"></button>
      </div>
      <button type="button" id="langBtn">🌐 AR</button>
      <div class="user-box" id="userBtn">
        <span class="avatar" id="headerAvatar"></span>
        <span class="uname" id="userLabel">Guest</span>
      </div>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <form id="chatForm">
      <button type="button" id="micBtn" class="mic-btn" aria-label="Mic"></button>
      <textarea id="promptInput" rows="1" placeholder="اكتب رسالتك أو استخدم المايك..."></textarea>
      <button type="submit" class="send" id="sendBtn" data-i18n="send">إرسال</button>
    </form>
  </footer>

  <div class="backdrop" id="authModal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong data-i18n="account">الحساب</strong>
        <button type="button" id="closeModal">✕</button>
      </div>
      <div id="loggedOut" style="display:flex;flex-direction:column;gap:8px">
        <div class="tabs">
          <button type="button" id="tabLogin" class="active" data-i18n="login">تسجيل دخول</button>
          <button type="button" id="tabSignup" data-i18n="signup">إنشاء حساب</button>
        </div>
        <input type="text" id="authName" placeholder="اسم المستخدم" style="display:none" />
        <input type="email" id="authEmail" placeholder="البريد الإلكتروني" />
        <input type="password" id="authPass" placeholder="كلمة المرور (مطابقة تامة)" autocomplete="current-password" />
        <button type="button" id="authSubmit" class="send" style="padding:8px" data-i18n="submit">متابعة</button>
      </div>
      <div id="loggedIn" style="display:none;flex-direction:column;align-items:center;gap:8px;text-align:center">
        <div class="avatar" id="modalAvatar" style="width:60px;height:60px"></div>
        <div id="userInfo" style="font-size:13px;font-weight:600"></div>
        <input type="file" id="avatarFile" accept="image/*" style="display:none" />
        <button type="button" id="changeAvatarBtn" data-i18n="changePhoto">تغيير الصورة</button>
        <button type="button" id="enableNotifBtn" data-i18n="enableAlerts">تفعيل الإشعارات</button>
        <button type="button" id="logoutBtn" data-i18n="logout">تسجيل خروج</button>
      </div>
      <div id="authStatus" style="font-size:12px;color:#334155;text-align:center"></div>
    </div>
  </div>

  <div class="backdrop" id="approvalModal">
    <div class="modal">
      <strong style="color:#b45309" data-i18n="secAlert">طلب تسجيل دخول جديد</strong>
      <div id="approvalText" style="font-size:13px"></div>
      <div style="display:flex;gap:8px">
        <button type="button" id="approveBtn" class="send" style="flex:1" data-i18n="approve">قبول</button>
        <button type="button" id="rejectBtn" style="flex:1;background:#fee2e2;color:#b91c1c;font-weight:700" data-i18n="reject">رفض</button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL="https://lzvtnfdgynwczrkwlwhf.supabase.co";
    const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6dnRuZmRneW53Y3pya3dsd2hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDIxMTEsImV4cCI6MjEwNDcxODExMX0.w2hNlJ4SszyMBkUVjr1qiWNTTPxHMHkM9YOFtVP-pVI";
    const sb=window.supabase.createClient(SB_URL,SB_KEY);

    const SHARE_URL="https://myai-iota-amber.vercel.app/";

    // إذا كانت الصفحة مستضافة على GitHub Pages، ضع رابط مشروعك على Vercel هنا مثل:
    // const API_BASE_URL = "https://your-project.vercel.app";
    const API_BASE_URL = "";
    const CHAT_ENDPOINT = `${API_BASE_URL}/api/chat`;

    const USER_SVG=`<svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.8-3.8 5-5.5 8-5.5s6.2 1.7 8 5.5"/></svg>`;
    const MIC_ICO=`<svg class="ico" style="width:17px;height:17px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>`;
    const MIC_REC=`<svg class="ico" style="width:17px;height:17px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><circle cx="19" cy="5" r="2.5" fill="currentColor" stroke="none"/></svg>`;
    const COPY_ICO=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const CHK_ICO=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>`;
    const EDIT_ICO=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`;

    const I18N={
      en:{stopVoice:"Stop Voice",send:"Send",account:"Account",login:"Sign In",signup:"Sign Up",submit:"Continue",changePhoto:"Change Photo",enableAlerts:"Enable Alerts",logout:"Sign Out",secAlert:"New Sign-In Request",approve:"Approve",reject:"Reject",phInput:"Type your message or use the mic...",phName:"Username",phEmail:"Email Address",phPass:"Password (exact match)",welcome:"Welcome to My AI.",waitingApproval:"Waiting for approval...",rejectedMsg:"Sign-in rejected.",timeoutMsg:"Request timed out. Please try again."},
      ar:{stopVoice:"إيقاف الصوت",send:"إرسال",account:"الحساب",login:"تسجيل دخول",signup:"إنشاء حساب",submit:"متابعة",changePhoto:"تغيير الصورة",enableAlerts:"تفعيل الإشعارات",logout:"تسجيل خروج",secAlert:"طلب تسجيل دخول جديد",approve:"قبول",reject:"رفض",phInput:"اكتب رسالتك أو استخدم المايك...",phName:"اسم المستخدم",phEmail:"البريد الإلكتروني",phPass:"كلمة المرور (مطابقة تامة)",welcome:"أهلاً بك في My AI.",waitingApproval:"بانتظار الموافقة...",rejectedMsg:"تم رفض الدخول.",timeoutMsg:"انتهت مهلة الطلب، حاول مرة أخرى."}
    };

    const $=id=>document.getElementById(id);
    const chatEl=$("chat"),chatForm=$("chatForm"),promptInput=$("promptInput"),sendBtn=$("sendBtn"),modelSelect=$("modelSelect"),
      micBtn=$("micBtn"),voiceSelect=$("voiceSelect"),stopBtn=$("stopBtn"),userBtn=$("userBtn"),userLabel=$("userLabel"),
      headerAvatar=$("headerAvatar"),modalAvatar=$("modalAvatar"),authModal=$("authModal"),closeModal=$("closeModal"),
      tabLogin=$("tabLogin"),tabSignup=$("tabSignup"),authName=$("authName"),authEmail=$("authEmail"),authPass=$("authPass"),
      authSubmit=$("authSubmit"),loggedOut=$("loggedOut"),loggedIn=$("loggedIn"),userInfo=$("userInfo"),logoutBtn=$("logoutBtn"),
      authStatus=$("authStatus"),avatarFile=$("avatarFile"),changeAvatarBtn=$("changeAvatarBtn"),enableNotifBtn=$("enableNotifBtn"),
      langBtn=$("langBtn"),approvalModal=$("approvalModal"),approvalText=$("approvalText"),approveBtn=$("approveBtn"),rejectBtn=$("rejectBtn"),
      liveDevicesCount=$("liveDevicesCount"),liveDevicesBadge=$("liveDevicesBadge"),shareLinkBtn=$("shareLinkBtn");

    let lang=localStorage.getItem("my_ai_lang")||"ar",voices=[],mode="login",history=[],busy=false,activeUserName="Guest",
      currentUser=null,currentAvatar="",isListening=false,recognition=null,realtimeSub=null,pendingReqId=null,
      presenceChannel=null,presenceSubscribed=false,presenceTimer=null;

    const deviceId="dev-"+(crypto?.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2,12));

    micBtn.innerHTML=MIC_ICO;
    shareLinkBtn.innerHTML=COPY_ICO;

    async function copyFixedUrl(){
      try{
        if(navigator.clipboard?.writeText){
          await navigator.clipboard.writeText(SHARE_URL);
          return true;
        }
      }catch{}
      try{
        const ta=document.createElement("textarea");
        ta.value=SHARE_URL;ta.style.position="fixed";ta.style.opacity="0";
        document.body.appendChild(ta);ta.select();
        const ok=document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      }catch{return false;}
    }

    shareLinkBtn.onclick=async()=>{
      const copied=await copyFixedUrl();
      if(copied){
        shareLinkBtn.innerHTML=CHK_ICO;
        setTimeout(()=>{shareLinkBtn.innerHTML=COPY_ICO;},1100);
      }
    };

    function updateLiveDevicesCount(){
      if(!presenceChannel)return;
      const state=presenceChannel.presenceState()||{};
      const keys=Object.keys(state);
      const total=keys.length;
      liveDevicesCount.textContent=String(total);
      liveDevicesBadge.title=lang==="ar"?`الأجهزة النشطة الآن: ${total}`:`Active devices now: ${total}`;
    }

    async function trackCurrentDevice(){
      if(!presenceChannel||!presenceSubscribed||document.hidden)return;
      try{
        await presenceChannel.track({
          device_id:deviceId,
          user:activeUserName||"Guest",
          joined_at:new Date().toISOString()
        });
      }catch{}
    }

    async function untrackCurrentDevice(){
      if(!presenceChannel)return;
      try{await presenceChannel.untrack();}catch{}
    }

    function stopPeriodicPresenceSync(){
      if(presenceTimer){clearInterval(presenceTimer);presenceTimer=null;}
    }

    function startPeriodicPresenceSync(){
      stopPeriodicPresenceSync();
      presenceTimer=setInterval(async()=>{
        if(document.hidden||!presenceChannel||!presenceSubscribed)return;
        await trackCurrentDevice();
        updateLiveDevicesCount();
      },5000);
    }

    function startLiveDeviceTracker(){
      stopPeriodicPresenceSync();
      if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null;}
      presenceSubscribed=false;
      presenceChannel=sb.channel("my-ai-live-devices",{config:{presence:{key:deviceId}}});
      presenceChannel
        .on("presence",{event:"sync"},updateLiveDevicesCount)
        .on("presence",{event:"join"},updateLiveDevicesCount)
        .on("presence",{event:"leave"},updateLiveDevicesCount)
        .subscribe(async status=>{
          if(status==="SUBSCRIBED"){
            presenceSubscribed=true;
            await trackCurrentDevice();
            updateLiveDevicesCount();
            startPeriodicPresenceSync();
          }
        });
    }

    window.addEventListener("pagehide",()=>{stopPeriodicPresenceSync();untrackCurrentDevice();});
    window.addEventListener("beforeunload",()=>{stopPeriodicPresenceSync();untrackCurrentDevice();});
    document.addEventListener("visibilitychange",async()=>{
      if(document.hidden){
        await untrackCurrentDevice();
        updateLiveDevicesCount();
      }else{
        await trackCurrentDevice();
        updateLiveDevicesCount();
      }
    });

    function applyLang(){
      const t=I18N[lang];
      document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
      langBtn.textContent=lang==="en"?"🌐 EN":"🌐 AR";
      shareLinkBtn.title=lang==="ar"?"نسخ الرابط https://myai-iota-amber.vercel.app/":"Copy link https://myai-iota-amber.vercel.app/";
      shareLinkBtn.setAttribute("aria-label",shareLinkBtn.title);
      document.querySelectorAll("[data-i18n]").forEach(el=>{if(t[el.dataset.i18n])el.textContent=t[el.dataset.i18n];});
      promptInput.placeholder=t.phInput;authName.placeholder=t.phName;authEmail.placeholder=t.phEmail;authPass.placeholder=t.phPass;
      updateLiveDevicesCount();
    }

    langBtn.onclick=()=>{lang=lang==="en"?"ar":"en";localStorage.setItem("my_ai_lang",lang);applyLang();};

    document.querySelectorAll(".dot").forEach(btn=>{
      btn.onclick=()=>{
        document.querySelectorAll(".dot").forEach(d=>d.classList.remove("active"));
        btn.classList.add("active");document.body.style.background=btn.dataset.bg;
        localStorage.setItem("my_ai_bg",btn.dataset.bg);
      };
    });
    const savedBg=localStorage.getItem("my_ai_bg");
    if(savedBg){document.body.style.background=savedBg;document.querySelectorAll(".dot").forEach(d=>d.classList.toggle("active",d.dataset.bg===savedBg));}

    function renderAvatars(){
      const html=currentAvatar?`<img src="${currentAvatar}" alt="avatar" />`:USER_SVG;
      headerAvatar.innerHTML=html;modalAvatar.innerHTML=html;
    }

    function findBestMicrosoftVoice(list){
      const pref=lang==="ar"?/ar/i:/en/i;
      return list.find(v=>/microsoft/i.test(v.name)&&pref.test(v.lang))||list.find(v=>/microsoft/i.test(v.name))||list.find(v=>pref.test(v.lang))||list[0]||null;
    }

    function loadVoices(){
      if(!("speechSynthesis"in window))return;
      voices=window.speechSynthesis.getVoices()||[];
      const ms=findBestMicrosoftVoice(voices);
      voiceSelect.innerHTML='<option value="">Microsoft Auto Voice</option>';
      voices.forEach((v,i)=>{
        const o=document.createElement("option");o.value=i;o.textContent=`${v.name} (${v.lang})`;
        if(ms&&v===ms)o.selected=true;voiceSelect.appendChild(o);
      });
    }

    function speakMicrosoft(text,fromMic){
      if(!fromMic||!("speechSynthesis"in window)||!text)return;
      const clean=String(text)
        .replace(/_{2,}/g," ")
        .replace(/-{2,}/g," ")
        .replace(/[^\u0600-\u06FFa-zA-Z0-9\s$.,?!،:؛\n]/g," ")
        .replace(/\s+/g," ")
        .trim();
      if(!clean)return;
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(clean);
      const idx=parseInt(voiceSelect.value,10);
      const v=(!Number.isNaN(idx)&&voices[idx])?voices[idx]:findBestMicrosoftVoice(voices);
      if(v){u.voice=v;u.lang=v.lang;}
      window.speechSynthesis.speak(u);
    }

    function setupSpeechRecognition(){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
      if(!SR)return null;
      const rec=new SR();rec.interimResults=false;
      rec.onstart=()=>{isListening=true;micBtn.classList.add("active");micBtn.innerHTML=MIC_REC;};
      rec.onresult=(ev)=>{const s=(ev.results?.[0]?.[0]?.transcript||"").trim();if(s){promptInput.value="";send(s,false,true);}};
      rec.onerror=rec.onend=()=>{isListening=false;micBtn.classList.remove("active");micBtn.innerHTML=MIC_ICO;};
      return rec;
    }

    micBtn.onclick=()=>{
      if(busy)return;
      if(!recognition)recognition=setupSpeechRecognition();
      if(!recognition)return;
      recognition.lang=lang==="ar"?"ar-SA":"en-US";
      if(isListening){recognition.stop();return;}
      if("speechSynthesis"in window)window.speechSynthesis.cancel();
      recognition.start();
    };

    async function syncAccount(user,customName="",avatarData=null){
      if(!user?.id||!user?.email)return;
      const fallback=customName||user.user_metadata?.display_name||user.email.split("@")[0];
      const {data:ex}=await sb.from("accounts").select("*").eq("id",user.id).maybeSingle();
      const row={id:user.id,email:user.email,display_name:customName||ex?.display_name||fallback,avatar_url:avatarData!==null?avatarData:(ex?.avatar_url||""),last_seen_at:new Date().toISOString()};
      const {data:saved}=await sb.from("accounts").upsert(row,{onConflict:"id"}).select().single();
      activeUserName=saved?.display_name||row.display_name;
      currentAvatar=saved?.avatar_url||row.avatar_url;
      userLabel.textContent=activeUserName;renderAvatars();
      userInfo.textContent=`${activeUserName} (${user.email})`;
      await trackCurrentDevice();
    }

    function subscribeLoginAlerts(userId){
      if(realtimeSub){sb.removeChannel(realtimeSub);realtimeSub=null;}
      if(!userId)return;
      realtimeSub=sb.channel("login-alerts-"+userId)
        .on("postgres_changes",{event:"INSERT",schema:"public",table:"login_requests",filter:`user_id=eq.${userId}`},p=>{
          const req=p.new;
          if(req?.status==="pending"){
            pendingReqId=req.id;
            approvalText.textContent=`Device: ${req.device_info}`;
            approvalModal.classList.add("open");
            if("Notification"in window&&Notification.permission==="granted"){
              const n=new Notification("My AI Security Alert",{body:`New sign-in from ${req.device_info}`});
              n.onclick=()=>{window.focus();approvalModal.classList.add("open");};
            }
          }
        }).subscribe();
    }

    approveBtn.onclick=async()=>{if(!pendingReqId)return;await sb.from("login_requests").update({status:"approved"}).eq("id",pendingReqId);pendingReqId=null;approvalModal.classList.remove("open");};
    rejectBtn.onclick=async()=>{if(!pendingReqId)return;await sb.from("login_requests").update({status:"rejected"}).eq("id",pendingReqId);pendingReqId=null;approvalModal.classList.remove("open");};

    async function requestLoginApproval(userId){
      const {data:req}=await sb.from("login_requests").insert({user_id:userId,device_info:navigator.userAgent.slice(0,70),status:"pending"}).select().single();
      if(!req)return true;
      authStatus.textContent=I18N[lang].waitingApproval;
      return new Promise(resolve=>{
        let done=false;
        const finish=ok=>{if(done)return;done=true;clearTimeout(t);sb.removeChannel(ch);resolve(ok);};
        const ch=sb.channel("wait-"+req.id).on("postgres_changes",{event:"UPDATE",schema:"public",table:"login_requests",filter:`id=eq.${req.id}`},p=>{
          if(p.new?.status==="approved")finish(true);
          if(p.new?.status==="rejected")finish(false);
        }).subscribe();
        const t=setTimeout(()=>finish(true),12000);
      });
    }

    async function refreshSession(){
      const {data}=await sb.auth.getSession();
      currentUser=data?.session?.user||null;
      if(currentUser){loggedOut.style.display="none";loggedIn.style.display="flex";await syncAccount(currentUser);subscribeLoginAlerts(currentUser.id);}
      else{activeUserName="Guest";currentAvatar="";userLabel.textContent="Guest";renderAvatars();loggedOut.style.display="flex";loggedIn.style.display="none";}
    }

    changeAvatarBtn.onclick=()=>avatarFile.click();
    avatarFile.onchange=e=>{
      const f=e.target.files?.[0];if(!f||!currentUser)return;
      const r=new FileReader();
      r.onload=()=>{const img=new Image();img.onload=async()=>{const c=document.createElement("canvas");c.width=96;c.height=96;c.getContext("2d").drawImage(img,0,0,96,96);await syncAccount(currentUser,"",c.toDataURL("image/jpeg",0.8));authStatus.textContent="Updated.";};img.src=r.result;};
      r.readAsDataURL(f);
    };

    enableNotifBtn.onclick=async()=>{if("Notification"in window)authStatus.textContent=`Alerts: ${await Notification.requestPermission()}`;};

    authSubmit.onclick=async()=>{
      const name=authName.value.trim(),email=authEmail.value.trim(),password=authPass.value;
      if(!email||password.length<6){authStatus.textContent="Enter email and exact password (6+ chars).";return;}
      authSubmit.disabled=true;authStatus.textContent="...";
      try{
        if(mode==="signup"){
          const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name||email.split("@")[0]}}});
          if(error){authStatus.textContent=error.message;return;}
          if(data?.user){currentUser=data.user;await syncAccount(currentUser,name);subscribeLoginAlerts(currentUser.id);loggedOut.style.display="none";loggedIn.style.display="flex";setTimeout(()=>authModal.classList.remove("open"),500);}
        }else{
          const {data,error}=await sb.auth.signInWithPassword({email,password});
          if(error){authStatus.textContent=error.message;return;}
          if(data?.user){
            const ok=await requestLoginApproval(data.user.id);
            if(!ok){await sb.auth.signOut();authStatus.textContent=I18N[lang].rejectedMsg;return;}
            currentUser=data.user;await syncAccount(currentUser);subscribeLoginAlerts(currentUser.id);loggedOut.style.display="none";loggedIn.style.display="flex";setTimeout(()=>authModal.classList.remove("open"),500);
          }
        }
      }finally{authSubmit.disabled=false;}
    };

    logoutBtn.onclick=async()=>{
      await sb.auth.signOut();if(realtimeSub){sb.removeChannel(realtimeSub);realtimeSub=null;}
      currentUser=null;activeUserName="Guest";currentAvatar="";userLabel.textContent="Guest";renderAvatars();loggedOut.style.display="flex";loggedIn.style.display="none";
    };

    function addMsg(role,text,fromMic=false){
      const box=document.createElement("div");box.className=`msg ${role}`;box.dataset.fromMic=fromMic?"1":"0";
      const body=document.createElement("div");body.textContent=text;box.appendChild(body);
      const act=document.createElement("div");act.className="actions";
      const cBtn=document.createElement("button");cBtn.type="button";cBtn.className="icon-btn";cBtn.innerHTML=COPY_ICO;
      cBtn.onclick=async()=>{try{await navigator.clipboard.writeText(body.textContent);cBtn.innerHTML=CHK_ICO;setTimeout(()=>cBtn.innerHTML=COPY_ICO,1000);}catch{}};
      act.appendChild(cBtn);
      if(role==="user"){
        const eBtn=document.createElement("button");eBtn.type="button";eBtn.className="icon-btn";eBtn.innerHTML=EDIT_ICO;
        eBtn.onclick=()=>{if(busy)return;const up=prompt("Edit:",body.textContent);if(up&&up.trim()&&up.trim()!==body.textContent){body.textContent=up.trim();send(up.trim(),true,box.dataset.fromMic==="1");}};
        act.appendChild(eBtn);
      }
      box.appendChild(act);chatEl.appendChild(box);chatEl.scrollTop=chatEl.scrollHeight;return body;
    }

    async function send(text,isEdit=false,fromMic=false){
      if(busy||!text.trim())return;busy=true;sendBtn.disabled=true;
      if("speechSynthesis"in window)window.speechSynthesis.cancel();
      if(!isEdit)addMsg("user",text,fromMic);
      if(isEdit&&history.length&&history[history.length-1].role==="user")history[history.length-1].content=text;
      else history.push({role:"user",content:text});
      history=history.slice(-4);
      const botBody=addMsg("bot","...",false);
      const controller=new AbortController();
      const timeoutId=setTimeout(()=>controller.abort(),25000);
      try{
        const r=await fetch(CHAT_ENDPOINT,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          signal:controller.signal,
          body:JSON.stringify({messages:history,model:modelSelect.value,userName:activeUserName})
        });
        const d=await r.json().catch(()=>({}));
        const rep=d?.choices?.[0]?.message?.content||d?.error||"No response.";
        botBody.textContent=typeof rep==="string"?rep:JSON.stringify(rep);
        if(r.ok&&typeof rep==="string"){history.push({role:"assistant",content:rep});history=history.slice(-4);speakMicrosoft(rep,fromMic);}
      }catch(err){
        botBody.textContent=err?.name==="AbortError"?I18N[lang].timeoutMsg:"Connection error.";
      }finally{
        clearTimeout(timeoutId);
        busy=false;sendBtn.disabled=false;chatEl.scrollTop=chatEl.scrollHeight;
      }
    }

    userBtn.onclick=()=>{authStatus.textContent="";authModal.classList.add("open");};
    closeModal.onclick=()=>authModal.classList.remove("open");
    authModal.onclick=e=>{if(e.target===authModal)authModal.classList.remove("open");};
    tabLogin.onclick=()=>{mode="login";tabLogin.classList.add("active");tabSignup.classList.remove("active");authName.style.display="none";authStatus.textContent="";};
    tabSignup.onclick=()=>{mode="signup";tabSignup.classList.add("active");tabLogin.classList.remove("active");authName.style.display="block";authStatus.textContent="";};
    stopBtn.onclick=()=>{if("speechSynthesis"in window)window.speechSynthesis.cancel();};
    chatForm.onsubmit=e=>{e.preventDefault();const t=promptInput.value.trim();if(!t)return;promptInput.value="";send(t,false,false);};
    promptInput.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();chatForm.requestSubmit();}};

    if("speechSynthesis"in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;}
    applyLang();renderAvatars();refreshSession();startLiveDeviceTracker();addMsg("bot",I18N[lang].welcome,false);
  </script>
</body>
</html>
